<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>首页</title>
<style>
@font-face{font-family:'Newsreader';font-weight:400;src:url('../../assets/fonts/newsreader-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;src:url('../../assets/fonts/newsreader-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;src:url('../../assets/fonts/newsreader-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF}
@font-face{font-family:'Noto Serif SC';font-weight:900;src:url('../../assets/fonts/zhan-seal.woff2') format('woff2')}
</style>
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#000}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #1C1B19; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <main style="flex: 1; display: flex; flex-direction: column; padding: 60px 24px 0">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <p style="margin: 0; font-size: 14px; color: #5F5A52">11月2日 · 周一</p>
      <p style="margin: 0; font-size: 13px; font-weight: 500; padding: 5px 10px; border: 1px solid #DAD6CC; border-radius: 999px">IELTS 核心词</p>
    </div>

    <h1 style="margin: 36px 0 0; font-size: 15px; font-weight: 500; color: #5F5A52">今天要做的</h1>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; margin-top: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-family: 'Newsreader', serif; font-size: 76px; line-height: 1; font-weight: 400; letter-spacing: -2px">48</p>
        <p style="margin: 0; font-size: 15px; color: #5F5A52">待复习</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <p style="margin: 0; font-family: 'Newsreader', serif; font-size: 76px; line-height: 1; font-weight: 400; letter-spacing: -2px">20</p>
        <p style="margin: 0; font-size: 15px; color: #5F5A52">新词</p>
      </div>
    </div>

    <div style="height: 1px; background: #E4E1D9; margin: 36px 0 24px"></div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <p style="margin: 0; font-size: 15px; font-weight: 500">词表进度</p>
        <p style="margin: 0; font-size: 14px; color: #5F5A52; font-variant-numeric: tabular-nums">312 / 3,575</p>
      </div>
      <div style="height: 6px; background: #E4E1D9; border-radius: 3px; overflow: hidden">
        <div style="width: 9%; height: 6px; background: #1C1B19; border-radius: 3px"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 24px">
      <a href="Lists.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; text-decoration: none; min-height: 44px">
        <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 4px; background: #1C1B19; color: #F6F5F1; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; transform: rotate(-4deg)">斩</span>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums">214</span>
          <span style="font-size: 12px; color: #5F5A52">已斩</span>
        </span>
      </a>
      <a href="Lists.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; text-decoration: none; min-height: 44px">
        <svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
        <span style="display: flex; flex-direction: column">
          <span style="font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums">37</span>
          <span style="font-size: 12px; color: #5F5A52">生词本</span>
        </span>
      </a>
    </div>

    <div style="flex: 1"></div>

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 2px 14px">
      <p style="margin: 0; font-size: 13px; color: #5F5A52">距上次备份已 16 天</p>
      <a href="Settings.dc.html" style="font-size: 13px; font-weight: 500; padding: 12px 0">导出备份</a>
    </div>

    <a href="Quiz.dc.html" style="height: 60px; border-radius: 16px; background: #1C1B19; color: #F6F5F1; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 500">
      开始学习
      <span style="font-size: 13px; font-weight: 400; color: #BDB8AE">约 15 分钟</span>
    </a>
  </main>

  <nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 26px; margin-top: 16px; border-top: 1px solid #E4E1D9; background: #F6F5F1">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #1C1B19; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
      学习
    </a>
    <a href="Lists.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      词本
    </a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M7 16v-5"></path><path d="M12 16V5"></path><path d="M17 16V9"></path></svg>
      统计
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
      设置
    </a>
  </nav>
</div>
</body>
</html>
