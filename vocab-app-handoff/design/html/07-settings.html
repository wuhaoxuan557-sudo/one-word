<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置</title>
<style>
@font-face{font-family:'Newsreader';font-weight:400;src:url('../../assets/fonts/newsreader-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;src:url('../../assets/fonts/newsreader-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;src:url('../../assets/fonts/newsreader-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF}
@font-face{font-family:'Noto Serif SC';font-weight:900;src:url('../../assets/fonts/zhan-seal.woff2') format('woff2')}
</style>
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#000}
</style>
</head>
<body>
<div style="width: 390px; height: 1000px; box-sizing: border-box; background: #F6F5F1; color: #1C1B19; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <main style="flex: 1; display: flex; flex-direction: column; padding: 60px 20px 0; gap: 22px">
    <h1 style="margin: 0 4px; font-size: 28px; font-weight: 700">设置</h1>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 500; color: #5F5A52; letter-spacing: 1px">学习</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 8px 0 16px">
          <span style="font-size: 15px">每日新词</span>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="减少每日新词" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">−</button>
            <span style="min-width: 40px; text-align: center; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums">20</span>
            <button type="button" aria-label="增加每日新词" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 8px 0 16px; border-top: 1px solid #EFECE6">
          <span style="font-size: 15px">每日复习上限</span>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="减少复习上限" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">−</button>
            <span style="min-width: 40px; text-align: center; font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums">200</span>
            <button type="button" aria-label="增加复习上限" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 500; color: #5F5A52; letter-spacing: 1px">发音</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 16px">
          <span style="font-size: 15px">出词时自动朗读</span>
          <button type="button" aria-label="自动朗读" aria-pressed="true" style="width: 52px; height: 32px; padding: 3px; border: 0; border-radius: 999px; background: #1C1B19; display: flex; justify-content: flex-end; cursor: pointer">
            <span style="width: 26px; height: 26px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,0.2)"></span>
          </button>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 12px 0 16px; border-top: 1px solid #EFECE6">
          <span style="font-size: 15px">口音</span>
          <div role="group" aria-label="口音" style="display: flex; gap: 3px; padding: 3px; background: #ECE9E2; border-radius: 10px">
            <button type="button" aria-pressed="true" style="min-height: 38px; min-width: 60px; border: 0; border-radius: 8px; background: #FFFFFF; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; cursor: pointer">英音</button>
            <button type="button" aria-pressed="false" style="min-height: 38px; min-width: 60px; border: 0; border-radius: 8px; background: transparent; color: #5F5A52; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; cursor: pointer">美音</button>
          </div>
        </div>
      </div>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 500; color: #5F5A52; letter-spacing: 1px">评分阈值</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; overflow: hidden">
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 8px 0 16px">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px">快速答对</span><span style="font-size: 12px; color: #5F5A52">记为 Easy</span></span>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="缩短快速阈值" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">−</button>
            <span style="min-width: 58px; text-align: center; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">≤ 2.0 秒</span>
            <button type="button" aria-label="延长快速阈值" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
        <div style="display: flex; align-items: center; justify-content: space-between; min-height: 60px; padding: 0 8px 0 16px; border-top: 1px solid #EFECE6">
          <span style="display: flex; flex-direction: column"><span style="font-size: 15px">慢速答对</span><span style="font-size: 12px; color: #5F5A52">记为 Hard</span></span>
          <div style="display: flex; align-items: center">
            <button type="button" aria-label="缩短慢速阈值" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">−</button>
            <span style="min-width: 58px; text-align: center; font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums">&gt; 6.0 秒</span>
            <button type="button" aria-label="延长慢速阈值" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1C1B19; font-size: 22px; cursor: pointer">+</button>
          </div>
        </div>
      </div>
      <p style="margin: 0 4px; font-size: 12px; color: #5F5A52">介于两者之间记为 Good；选错或点"不认识"记为 Again</p>
    </section>

    <section style="display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0 4px; font-size: 12px; font-weight: 500; color: #5F5A52; letter-spacing: 1px">数据</h2>
      <div style="background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; overflow: hidden">
        <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 15px; text-align: left; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"></path></svg>
          <span style="flex: 1">导出备份</span>
          <span style="font-size: 13px; color: #5F5A52">上次 16 天前</span>
        </button>
        <button type="button" style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; border-top: 1px solid #EFECE6; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 15px; text-align: left; cursor: pointer">
          <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M7 9l5-5 5 5M5 20h14"></path></svg>
          <span style="flex: 1">导入备份</span>
        </button>
      </div>
      <p style="margin: 0 4px; font-size: 12px; color: #7E2A1E">导入会覆盖当前全部学习记录，操作前会再确认一次</p>
    </section>
  </main>

  <nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 26px; margin-top: 16px; border-top: 1px solid #E4E1D9; background: #F6F5F1">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
      学习
    </a>
    <a href="Lists.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      词本
    </a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M7 16v-5"></path><path d="M12 16V5"></path><path d="M17 16V9"></path></svg>
      统计
    </a>
    <a href="Settings.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #1C1B19; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
      设置
    </a>
  </nav>
</div>
</body>
</html>
