      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>

  <section style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 24px">

      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg>
      /ˈmɪtɪɡeɪt/

      <button type="button" style="min-height: 64px; display: flex; align-items: center; gap: 14px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #E4E1D9; background: #FFFFFF; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 16px; text-align: left; cursor: pointer">
        <span style="font-size: 13px; color: #6E685F; font-variant-numeric: tabular-nums; width: 10px">1</span>

        <span style="font-size: 13px; color: #6E685F; font-variant-numeric: tabular-nums; width: 10px">2</span>

      <button type="button" style="align-self: center; min-height: 48px; padding: 0 24px; border: 0; background: transparent; color: #5F5A52; font-family: 'Noto Sans SC', sans-serif; font-size: 15px; cursor: pointer">不认识</button>
