<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词本</title>
<style>
@font-face{font-family:'Newsreader';font-weight:400;src:url('../../assets/fonts/newsreader-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:500;src:url('../../assets/fonts/newsreader-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;src:url('../../assets/fonts/newsreader-latin-400-italic.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Noto Sans';font-weight:400;src:url('../../assets/fonts/noto-sans-latin-ext-400-normal.woff2') format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF}
@font-face{font-family:'Noto Serif SC';font-weight:900;src:url('../../assets/fonts/zhan-seal.woff2') format('woff2')}
</style>
<style>
body{margin:0}
a{color:#1C1B19}a:hover{color:#000}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F5F1; color: #1C1B19; font-family: 'Noto Sans SC', 'PingFang SC', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <main style="flex: 1; display: flex; flex-direction: column; padding: 60px 20px 0; gap: 16px; overflow: hidden">
    <h1 style="margin: 0 4px; font-size: 28px; font-weight: 700">词本</h1>

    <div role="tablist" aria-label="词本分类" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #ECE9E2; border-radius: 12px">
      <button type="button" role="tab" aria-selected="false" style="min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: #5F5A52; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">生词本 37</button>
      <button type="button" role="tab" aria-selected="true" style="min-height: 40px; border: 0; border-radius: 9px; background: #FFFFFF; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 14px; font-weight: 500; cursor: pointer">已斩 214</button>
    </div>

    <div style="display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 14px; background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 12px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6E685F" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜索单词</label>
      <input id="q" type="search" placeholder="搜索单词或释义" style="flex: 1; border: 0; outline: none; background: transparent; font-family: 'Noto Sans SC', sans-serif; font-size: 15px; color: #1C1B19; min-height: 44px">
    </div>

    <p style="margin: 0 4px; font-size: 12px; color: #5F5A52">按斩的时间排序 · 撤销后重新进入复习</p>

    <ul style="list-style: none; margin: 0; padding: 0; background: #FFFFFF; border: 1px solid #E4E1D9; border-radius: 14px; overflow: hidden">
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid transparent">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">abundant</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">adj. 丰富的；充裕的</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">contemporary</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">adj. 当代的；同时代的</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">deteriorate</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">v. 恶化；变坏</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">elaborate</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">adj. 精心制作的；详尽的</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">hypothesis</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">n. 假设；假说</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">inevitable</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">adj. 不可避免的</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
        <li style="display: flex; align-items: center; gap: 12px; padding: 10px 10px 10px 16px; border-top: 1px solid #EFECE6">
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-family: 'Newsreader', serif; font-size: 19px; font-weight: 500">negligible</span>
            <span style="font-size: 13px; color: #5F5A52; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">adj. 可忽略的；微不足道的</span>
          </div>
          <button type="button" style="min-height: 36px; min-width: 56px; padding: 0 12px; border: 1px solid #DAD6CC; border-radius: 999px; background: transparent; color: #1C1B19; font-family: 'Noto Sans SC', sans-serif; font-size: 13px; cursor: pointer">撤销</button>
        </li>
      
    </ul>
  </main>

  <nav aria-label="主导航" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 10px 8px 26px; margin-top: 12px; border-top: 1px solid #E4E1D9; background: #F6F5F1">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4h6a4 4 0 0 1 4 4v13a3 3 0 0 0-3-3H2z"></path><path d="M22 4h-6a4 4 0 0 0-4 4v13a3 3 0 0 1 3-3h7z"></path></svg>
      学习
    </a>
    <a href="Lists.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #1C1B19; font-size: 11px; font-weight: 500; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
      词本
    </a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20h18"></path><path d="M7 16v-5"></path><path d="M12 16V5"></path><path d="M17 16V9"></path></svg>
      统计
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6E685F; font-size: 11px; min-height: 44px">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h9M17 6h3M4 12h3M11 12h9M4 18h11M19 18h1"></path><circle cx="15" cy="6" r="2"></circle><circle cx="9" cy="12" r="2"></circle><circle cx="17" cy="18" r="2"></circle></svg>
      设置
    </a>
  </nav>
</div>
</body>
</html>
