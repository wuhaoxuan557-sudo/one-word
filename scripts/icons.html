<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Generate seal icons</title>
<h1>Generate seal icons</h1><p>Uses the existing WOFF2 font and browser canvas; no dependencies.</p>
<button id="generate">Generate PNG icons</button><div id="output"></div>
<script type="module">
  document.querySelector('#generate').onclick = async () => {
    const base = import.meta.env.BASE_URL;
    const tokens = await (await fetch(`${base}src/styles/tokens.css`)).text();
    const color = name => new RegExp(`--${name}:\\s*(#[\\da-f]+)`, 'i').exec(tokens)[1];
    const font = new FontFace('ZhanSeal', `url(${base}assets/fonts/zhan-seal.woff2)`);
    document.fonts.add(await font.load());
    const output = document.querySelector('#output'); output.replaceChildren();
    for (const size of [192, 512, 180]) {
      const canvas = document.createElement('canvas'); canvas.width = canvas.height = size;
      const context = canvas.getContext('2d');
      context.fillStyle = color('ink'); context.fillRect(0, 0, size, size);
      context.translate(size / 2, size / 2); context.rotate(-4 * Math.PI / 180);
      context.fillStyle = color('on-ink'); context.font = `${size / 2}px ZhanSeal`;
      context.textAlign = 'center'; context.textBaseline = 'middle'; context.fillText('斩', 0, size * 0.025);
      const link = document.createElement('a'); link.download = size === 180 ? 'apple-touch-icon.png' : `icon-${size}.png`;
      link.href = canvas.toDataURL('image/png'); link.textContent = `Download ${size}`; output.append(canvas, link, document.createElement('br'));
    }
  };
</script></html>
