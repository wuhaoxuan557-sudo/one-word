<!doctype html>
<html lang="en"><meta charset="utf-8"><title>PWA preview checks</title>
<h1>PWA preview checks</h1><p>This read-only helper is copied into dist/tests for local preview checks only.</p>
<button id="check">Check cached resources</button><button id="update">Check for a real worker update</button><pre id="result"></pre>
<script>
const base = new URL('../', location.href);
const output = document.querySelector('#result');
document.querySelector('#check').onclick = async () => {
  try {
    const registration = await navigator.serviceWorker.getRegistration(base.href);
    const names = await caches.keys();
    const resources = [];
    for (const name of names) {
      const cache = await caches.open(name);
      const keys = await cache.keys();
      resources.push({ name, urls: keys.map(key => new URL(key.url).pathname) });
    }
    output.textContent = JSON.stringify({ scope: registration?.scope, active: registration?.active?.state,
      waiting: registration?.waiting?.state ?? null, resources }, null, 2);
  } catch (error) { output.textContent = String(error); }
};
document.querySelector('#update').onclick = async () => {
  try {
    const registration = await navigator.serviceWorker.getRegistration(base.href);
    await registration.update(); output.textContent = 'Real worker update check requested.';
  } catch (error) { output.textContent = String(error); }
};
</script></html>
